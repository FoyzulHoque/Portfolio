server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;

    include /etc/nginx/security-headers.conf;

    # never serve dotfiles
    location ~ /\. { deny all; }

    # page: always revalidate so a deploy shows up immediately
    location = /index.html {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    # css/js are not fingerprinted, keep the cache short
    location ~* \.(css|js)$ { expires 1h; }

    # images, certificates, CVs
    location /assets/ { expires 7d; }

    location / { try_files $uri $uri/ =404; }
}
