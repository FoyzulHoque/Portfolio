# CI: runs on every pull request and every push to main.
# The server (deploy/deploy.sh) only deploys a commit on main after this workflow is green.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Content, syntax and secret checks
        run: node scripts/check.js

      - name: Shell scripts parse
        run: |
          for f in deploy/*.sh; do bash -n "$f"; done

      - name: Docker image builds
        run: docker build -t portfolio:ci .

      - name: Container serves the site
        run: |
          docker run -d --name portfolio-test -p 8080:80 portfolio:ci
          for i in $(seq 1 20); do curl -fsS http://localhost:8080/ >/dev/null && break || sleep 1; done
          curl -fsS http://localhost:8080/ | grep -q "Foyzul Hoque"
          curl -fsS -o /dev/null http://localhost:8080/js/content.js
          curl -fsS -o /dev/null http://localhost:8080/assets/cv/Foyzul_Hoque_Academic_CV.pdf
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/.env)" != 200
          # security headers must be present on the page and on static files
          for u in / /js/content.js /assets/profile.png; do
            curl -sI "http://localhost:8080$u" | grep -qi '^x-content-type-options: nosniff' || { echo "missing security headers on $u"; exit 1; }
          done
          docker rm -f portfolio-test
