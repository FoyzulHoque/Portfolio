<!DOCTYPE html>
<html lang="en" data-mode="academic" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Foyzul Hoque · Portfolio</title>
  <meta name="description" content="Foyzul Hoque — AI researcher and Flutter mobile engineer. Switch between the academic and industry view.">
  <meta name="theme-color" content="#eef0f6">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script>
    /* Apply saved mode/theme before first paint (no flash). ?mode=industry in the URL wins. */
    (function () {
      try {
        var q = new URLSearchParams(location.search).get('mode');
        var m = q === 'industry' || q === 'academic' ? q : localStorage.getItem('mode');
        var t = localStorage.getItem('theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        if (m === 'industry' || m === 'academic') document.documentElement.dataset.mode = m;
        document.documentElement.dataset.theme = t;
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <a class="skip" href="#app">Skip to content</a>

  <!-- Spatial background: slow floating colour orbs -->
  <div class="bg" aria-hidden="true">
    <span class="orb o1"></span><span class="orb o2"></span><span class="orb o3"></span>
  </div>

  <header class="nav glass" id="nav">
    <a class="brand" href="#top" aria-label="Foyzul Hoque, home"><span class="brand-mark">FH</span><span class="brand-name">Foyzul Hoque</span></a>
    <nav class="nav-links" id="navLinks" aria-label="Sections"></nav>
    <div class="nav-tools">
      <div class="switch" role="tablist" aria-label="Portfolio mode" id="modeSwitch">
        <span class="switch-thumb" aria-hidden="true"></span>
        <button role="tab" data-mode="academic">Academic</button>
        <button role="tab" data-mode="industry">Industry</button>
      </div>
      <button class="theme-btn neu" id="themeBtn" aria-label="Toggle dark mode"><span aria-hidden="true"></span></button>
    </div>
  </header>

  <main id="app"></main>

  <dialog class="lightbox" id="lightbox" aria-label="Document viewer"><form method="dialog"><button class="lb-close" aria-label="Close">✕</button></form>
    <img id="lbImg" alt="" draggable="false"><p id="lbCap"></p></dialog>

  <footer class="footer">
    <p>© <span id="year"></span> Foyzul Hoque · Dhaka, Bangladesh</p>
  </footer>

  <script src="js/content.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
